services:
  streamlit:
    image: dass33/nsm-streamlit:latest
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data/jobs
    environment:
      DATA_DIR: /data/jobs
      POLL_INTERVAL_S: 5
      # The labs machine does not scale to zero, so idle disconnect is off.
      IDLE_TIMEOUT_S: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  watchtower:
    image: containrrr/watchtower
    environment:
          - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --interval 300
    restart: unless-stopped
