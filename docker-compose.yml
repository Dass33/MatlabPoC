services:
  # Rust web frontend (replaces the previous streamlit service)
  nsm-processor:
    build:
      context: ./nsm-rust
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data/jobs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATA_DIR: /data/jobs
      HOST_DATA_DIR: ${HOST_DATA_DIR:?HOST_DATA_DIR must be set in .env}
      MATLAB_IMAGE: matlab-algorithm:latest
      MAX_WORKERS: 2
      POLL_INTERVAL_S: 5
      PORT: 3000
      RUST_LOG: nsm_processor=info,tower_http=warn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
