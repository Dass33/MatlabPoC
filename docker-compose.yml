services:
  streamlit:
    build:
      context: ./streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data/jobs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATA_DIR: /data/jobs
      HOST_DATA_DIR: ${HOST_DATA_DIR:?HOST_DATA_DIR must be set in .env}
      MATLAB_IMAGE: matlab-algorithm:latest
      MAX_WORKERS: 2
      POLL_INTERVAL_S: 5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
