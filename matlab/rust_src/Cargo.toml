[package]
name = "nsm-algorithm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nsm-algorithm"
path = "src/main.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tiff        = "0.9"
ndarray     = "0.16"
statrs      = "0.17"
lapjv       = "0.3"
rayon       = "1"
image       = { version = "0.25", default-features = false, features = ["png"] }
plotters    = { version = "0.3", features = ["bitmap_backend"] }
anyhow      = "1"
thiserror   = "1"
tempfile    = "3"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
