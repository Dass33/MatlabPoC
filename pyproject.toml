[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: requires Docker + matlab-algorithm:latest image (use --run-integration to enable)",
]
filterwarnings = [
    "ignore::DeprecationWarning:streamlit",
]
# Run from repo root with: source streamlit/venv/bin/activate && python -m pytest
# Integration tests (require Docker + matlab-algorithm:latest): add --run-integration

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-mock>=3.14"]
